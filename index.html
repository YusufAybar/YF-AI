<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="yf-relay" content="https://yf-ai-relay.yfcik07.workers.dev" />
  <title>YF 0 | YF'ye Sorun</title>
  <style>
    :root {
      --bg-top: #071928;
      --bg-mid: #080b18;
      --bg-bottom: #180628;
      --header-bg: #110b29;
      --panel-soft: rgba(25, 21, 56, 0.72);
      --text: #eef2ff;
      --muted: #a5b0d0;
      --neon-cyan: #22d3ee;
      --neon-purple: #c026d3;
      --neon-pink: #e879f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text);
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
      overflow: hidden;
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 920px;
      margin: 0 auto;
      position: relative;
    }

    .topbar {
      background: var(--header-bg);
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      z-index: 30;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      position: relative;
    }

    .menu-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--neon-cyan);
    }

    .menu-btn:active {
      transform: scale(0.95);
    }

    .profile-menu {
      display: none;
      position: absolute;
      top: 115%;
      left: 0;
      width: 270px;
      max-height: 340px;
      overflow-y: auto;
      background: #140f2e;
      border: 1px solid rgba(34, 211, 238, 0.45);
      border-radius: 14px;
      padding: 0.65rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.78);
      z-index: 50;
    }

    .profile-menu.open {
      display: block;
    }

    .profile-menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.25rem 0.35rem 0.55rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
    }

    .menu-clear-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      font-size: 0.74rem;
      cursor: pointer;
    }

    .menu-clear-btn:hover {
      border-color: var(--neon-cyan);
    }

    .menu-chat-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .menu-chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;
      padding: 0.45rem 0.6rem;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
    }

    .menu-chat-item.active {
      background: rgba(34, 211, 238, 0.16);
      border-color: var(--neon-cyan);
      color: #ffffff;
    }

    .menu-chat-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .menu-chat-del {
      background: transparent;
      border: none;
      color: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0 0.2rem;
      opacity: 0.75;
    }

    .menu-chat-del:hover {
      opacity: 1;
      color: #f87171;
    }

    .brand-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .model-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      border-radius: 8px;
      padding: 0.25rem 0.55rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .model-dropdown {
      display: none;
      position: absolute;
      top: 120%;
      left: 0;
      min-width: 165px;
      background: #140f2e;
      border: 1px solid rgba(192, 38, 211, 0.5);
      border-radius: 12px;
      padding: 0.35rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
      z-index: 40;
    }

    .model-dropdown.open {
      display: block;
    }

    .model-option {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .model-option:hover,
    .model-option.active {
      background: rgba(192, 38, 211, 0.22);
      color: var(--neon-pink);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--neon-pink);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      filter: drop-shadow(0 0 6px rgba(217, 70, 239, 0.45));
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(217, 70, 239, 0.12);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .workspace {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      min-height: 160px;
    }

    .empty-hint {
      margin: auto;
      text-align: center;
      color: rgba(238, 242, 255, 0.45);
      font-size: 0.92rem;
      padding: 1rem;
    }

    .bubble {
      max-width: 84%;
      padding: 0.8rem 1rem;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.24), rgba(192, 38, 211, 0.28));
      border: 1px solid rgba(34, 211, 238, 0.55);
      color: #ffffff;
    }

    .bubble.bot {
      align-self: flex-start;
      background: rgba(14, 17, 36, 0.82);
      border: 1px solid rgba(192, 38, 211, 0.35);
      color: var(--text);
    }

    .composer-wrap {
      padding: 0.4rem 1.1rem 1.15rem;
      position: relative;
      z-index: 20;
    }

    .ai-disclaimer {
      text-align: center;
      font-size: 0.74rem;
      color: rgba(238, 242, 255, 0.5);
      margin-bottom: 0.45rem;
      letter-spacing: 0.01em;
    }

    .neon-box {
      border-radius: 26px;
      padding: 2px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      box-shadow: 0 0 22px rgba(192, 38, 211, 0.28);
    }

    .neon-inner {
      background: #090b17;
      border-radius: 24px;
      padding: 0.85rem 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .prompt-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1.02rem;
    }

    .prompt-input::placeholder {
      color: #8b93ad;
    }

    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .left-tools,
    .right-tools {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .tool-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      transition: transform 0.15s ease;
    }

    .tool-btn:active {
      transform: scale(0.94);
    }

    .mic-icon {
      color: var(--neon-pink);
      filter: drop-shadow(0 0 6px rgba(217, 70, 239, 0.55));
    }

    .mic-icon.listening {
      color: var(--neon-cyan);
      filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.85));
      transform: scale(1.12);
    }

    .send-icon {
      color: #38bdf8;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
    }

    .settings-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 14, 0.72);
      backdrop-filter: blur(4px);
      z-index: 60;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .settings-backdrop.open {
      display: flex;
    }

    .settings-modal {
      width: 100%;
      max-width: 400px;
      background: #140f2e;
      border: 1px solid rgba(34, 211, 238, 0.45);
      border-radius: 18px;
      padding: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .settings-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-top h3 {
      font-size: 1.05rem;
      color: #ffffff;
    }

    .close-modal-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    .settings-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .settings-badge {
      font-size: 0.82rem;
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--neon-cyan);
    }

    .settings-btns {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .mini-btn {
      background: var(--panel-soft);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .mini-btn:hover {
      border-color: var(--neon-cyan);
    }

    .mini-btn.primary {
      background: rgba(34, 211, 238, 0.18);
      border-color: var(--neon-cyan);
      color: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-left">
        <button type="button" class="menu-btn" id="profileMenuBtn" title="Menü" aria-label="Menü" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="profile-menu" id="profileMenu">
          <div class="profile-menu-header">
            <span>Sohbetler</span>
            <button type="button" class="menu-clear-btn" id="clearAllBtn">Temizle</button>
          </div>
          <div class="menu-chat-list" id="menuChatList"></div>
        </div>

        <div class="brand-wrap">
          <span class="brand-title">YF</span>
          <button type="button" class="model-btn" id="modelBtn" aria-expanded="false">
            <span id="activeModelLabel">0</span>
            <span>⌄</span>
          </button>
          <div class="model-dropdown" id="modelDropdown">
            <button type="button" class="model-option active" data-model="0 (Alpha 3.78B)" data-badge="0">YF 0 Alpha</button>
          </div>
        </div>
      </div>

      <div class="top-actions">
        <button type="button" class="icon-btn" id="newChatBtn" title="Yeni Sohbet" aria-label="Yeni Sohbet">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <button type="button" class="icon-btn" id="cookieSettingsBtn" title="Ayarlar" aria-label="Ayarlar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="messages" id="messages">
        <div class="empty-hint" id="emptyHint">YF'ye sorun</div>
      </section>
    </main>

    <div class="composer-wrap">
      <div class="ai-disclaimer">YF hata yapabilir.</div>
      <form class="neon-box" id="composerForm">
        <div class="neon-inner">
          <input
            type="text"
            id="promptInput"
            class="prompt-input"
            placeholder="YF'ye sorun"
            autocomplete="off"
          />
          <div class="composer-bar">
            <div class="left-tools">
              <button type="button" class="tool-btn mic-icon" id="micBtn" title="Sesle Yaz" aria-label="Sesle Yaz">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                  <line x1="12" y1="19" x2="12" y2="23"></line>
                  <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
              </button>
            </div>

            <div class="right-tools">
              <button type="submit" class="tool-btn send-icon" id="sendBtn" title="Gönder" aria-label="Gönder">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>

    <div class="settings-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-modal">
        <div class="settings-top">
          <h3 id="settingsTitle">Ayarlar</h3>
          <button type="button" class="close-modal-btn" id="closeModalBtn" aria-label="Kapat">×</button>
        </div>
        <p class="settings-desc">
          Sohbetlerin cihazınızda saklanması için çerez izni.
        </p>
        <div class="settings-badge" id="modalStatusBadge">Çerez Durumu: Bekleniyor</div>
        <div class="settings-btns">
          <button type="button" class="mini-btn primary" id="acceptCookiesBtn">Çerezleri Kabul Et</button>
          <button type="button" class="mini-btn" id="rejectCookiesBtn">Reddet</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const RELAY_API_URL = document.querySelector('meta[name="yf-relay"]')?.content || "https://yf-ai-relay.yfcik07.workers.dev";
    const CONSENT_COOKIE_NAME = "yf_chat_cookie_consent";
    const STORAGE_KEY = "yf_0_saved_chats_v1";

    let cookieConsent = readConsent();
    let activeModel = "0 (Alpha 3.78B)";
    let conversations = [];
    let activeConvId = null;

    const profileMenuBtn = document.getElementById("profileMenuBtn");
    const profileMenu = document.getElementById("profileMenu");
    const menuChatList = document.getElementById("menuChatList");
    const modelBtn = document.getElementById("modelBtn");
    const modelDropdown = document.getElementById("modelDropdown");
    const activeModelLabel = document.getElementById("activeModelLabel");
    const newChatBtn = document.getElementById("newChatBtn");
    const cookieSettingsBtn = document.getElementById("cookieSettingsBtn");
    const settingsModal = document.getElementById("settingsModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const modalStatusBadge = document.getElementById("modalStatusBadge");
    const acceptCookiesBtn = document.getElementById("acceptCookiesBtn");
    const rejectCookiesBtn = document.getElementById("rejectCookiesBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const messagesEl = document.getElementById("messages");
    const composerForm = document.getElementById("composerForm");
    const promptInput = document.getElementById("promptInput");
    const micBtn = document.getElementById("micBtn");

    function writeConsent(value) {
      cookieConsent = value;
      try {
        document.cookie = `${CONSENT_COOKIE_NAME}=${value}; max-age=31536000; path=/; SameSite=Lax`;
      } catch (_) {}
      try {
        localStorage.setItem(CONSENT_COOKIE_NAME, value);
      } catch (_) {}
      updateConsentBadge();
    }

    function readConsent() {
      try {
        const ls = localStorage.getItem(CONSENT_COOKIE_NAME);
        if (ls === "accepted" || ls === "rejected") return ls;
      } catch (_) {}
      try {
        const match = document.cookie
          .split("; ")
          .find((row) => row.startsWith(`${CONSENT_COOKIE_NAME}=`));
        if (match) return match.split("=")[1];
      } catch (_) {}
      return null;
    }

    function updateConsentBadge() {
      if (!modalStatusBadge) return;
      if (cookieConsent === "accepted") {
        modalStatusBadge.textContent = "Çerez Durumu: Kabul edildi";
      } else if (cookieConsent === "rejected") {
        modalStatusBadge.textContent = "Çerez Durumu: Reddedildi";
      } else {
        modalStatusBadge.textContent = "Çerez Durumu: Bekleniyor";
      }
    }

    function saveConversations() {
      if (cookieConsent !== "accepted") return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
      } catch (_) {}
    }

    function loadConversations() {
      if (cookieConsent !== "accepted") {
        conversations = [];
        return;
      }
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        conversations = raw ? JSON.parse(raw) : [];
      } catch (_) {
        conversations = [];
      }
    }

    function createNewConversation() {
      const id = "chat_" + Date.now();
      const conv = {
        id,
        title: "Yeni Sohbet",
        model: activeModel,
        messages: []
      };
      conversations.unshift(conv);
      activeConvId = id;
      saveConversations();
      renderMenuChats();
      renderMessages();
    }

    function getActiveConversation() {
      if (!activeConvId) {
        if (conversations.length > 0) {
          activeConvId = conversations[0].id;
        } else {
          createNewConversation();
        }
      }
      return conversations.find((c) => c.id === activeConvId) || conversations[0];
    }

    function renderMenuChats() {
      if (!menuChatList) return;
      menuChatList.innerHTML = "";
      if (conversations.length === 0) {
        const empty = document.createElement("div");
        empty.style.fontSize = "0.78rem";
        empty.style.color = "#8b93ad";
        empty.style.padding = "0.35rem";
        empty.textContent = "Kayıtlı sohbet yok.";
        menuChatList.appendChild(empty);
        return;
      }

      conversations.forEach((conv) => {
        const item = document.createElement("div");
        item.className = `menu-chat-item ${conv.id === activeConvId ? "active" : ""}`;

        const titleSpan = document.createElement("span");
        titleSpan.className = "menu-chat-title";
        titleSpan.textContent = conv.title;
        titleSpan.addEventListener("click", () => {
          activeConvId = conv.id;
          renderMenuChats();
          renderMessages();
          profileMenu.classList.remove("open");
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "menu-chat-del";
        delBtn.textContent = "×";
        delBtn.title = "Sil";
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          conversations = conversations.filter((c) => c.id !== conv.id);
          if (activeConvId === conv.id) {
            activeConvId = conversations[0]?.id || null;
          }
          saveConversations();
          renderMenuChats();
          renderMessages();
        });

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        menuChatList.appendChild(item);
      });
    }

    function renderMessages() {
      if (!messagesEl) return;
      const conv = getActiveConversation();
      messagesEl.innerHTML = "";

      if (!conv || conv.messages.length === 0) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "YF'ye sorun";
        messagesEl.appendChild(hint);
        return;
      }

      conv.messages.forEach((m) => {
        const div = document.createElement("div");
        div.className = `bubble ${m.role}`;
        div.textContent = m.text;
        messagesEl.appendChild(div);
      });

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function fallbackReply(question) {
      const q = question.toLowerCase();
      if (q.includes("kimsin")) {
        return "Ben YF 0 Alpha.";
      }
      if (q.includes("merhaba") || q.includes("selam")) {
        return "Merhaba! Nasıl yardımcı olabilirim?";
      }
      return "Şu an sunucuya ulaşılamıyor, lütfen tekrar deneyin.";
    }

    async function querySpace(question) {
      const res = await fetch(RELAY_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, model: activeModel })
      });
      let data = {};
      try {
        data = await res.json();
      } catch (_) {
        throw new Error(`Sunucu geçersiz yanıt döndürdü (HTTP ${res.status})`);
      }
      if (!res.ok || data.error) {
        throw new Error(data.error || `Sunucu hatası (HTTP ${res.status})`);
      }
      if (typeof data.reply === "string" && data.reply.trim() !== "") {
        return data.reply;
      }
      throw new Error("Model boş yanıt döndürdü.");
    }

    async function sendPrompt(text) {
      const conv = getActiveConversation();
      if (conv.messages.length === 0) {
        conv.title = text.slice(0, 26) + (text.length > 26 ? "..." : "");
      }

      conv.messages.push({ role: "user", text });
      saveConversations();
      renderMenuChats();
      renderMessages();

      const pendingMsg = { role: "bot", text: "Düşünüyor..." };
      conv.messages.push(pendingMsg);
      renderMessages();

      try {
        const answer = await querySpace(text);
        pendingMsg.text = answer;
      } catch (err) {
        pendingMsg.text = `Hata: ${err && err.message ? err.message : fallbackReply(text)}`;
      }

      saveConversations();
      renderMessages();
    }

    if (profileMenuBtn && profileMenu) {
      profileMenuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (modelDropdown) modelDropdown.classList.remove("open");
        const isOpen = profileMenu.classList.toggle("open");
        profileMenuBtn.setAttribute("aria-expanded", String(isOpen));
        renderMenuChats();
      });
    }

    if (modelBtn && modelDropdown) {
      modelBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (profileMenu) profileMenu.classList.remove("open");
        const isOpen = modelDropdown.classList.toggle("open");
        modelBtn.setAttribute("aria-expanded", String(isOpen));
      });
    }

    document.querySelectorAll(".model-option").forEach((opt) => {
      opt.addEventListener("click", () => {
        document.querySelectorAll(".model-option").forEach((o) => o.classList.remove("active"));
        opt.classList.add("active");
        activeModel = opt.dataset.model;
        if (activeModelLabel) activeModelLabel.textContent = opt.dataset.badge;
        if (modelDropdown) modelDropdown.classList.remove("open");
      });
    });

    document.addEventListener("click", (e) => {
      if (modelDropdown && modelBtn && !modelDropdown.contains(e.target) && e.target !== modelBtn) {
        modelDropdown.classList.remove("open");
      }
      if (profileMenu && profileMenuBtn && !profileMenu.contains(e.target) && e.target !== profileMenuBtn) {
        profileMenu.classList.remove("open");
      }
    });

    if (newChatBtn) {
      newChatBtn.addEventListener("click", () => {
        createNewConversation();
        if (profileMenu) profileMenu.classList.remove("open");
      });
    }

    if (cookieSettingsBtn && settingsModal) {
      cookieSettingsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        updateConsentBadge();
        settingsModal.classList.add("open");
      });
    }

    if (closeModalBtn && settingsModal) {
      closeModalBtn.addEventListener("click", () => {
        settingsModal.classList.remove("open");
      });
    }

    if (settingsModal) {
      settingsModal.addEventListener("click", (e) => {
        if (e.target === settingsModal) settingsModal.classList.remove("open");
      });
    }

    if (acceptCookiesBtn) {
      acceptCookiesBtn.addEventListener("click", () => {
        writeConsent("accepted");
        saveConversations();
        renderMenuChats();
        if (settingsModal) settingsModal.classList.remove("open");
      });
    }

    if (rejectCookiesBtn) {
      rejectCookiesBtn.addEventListener("click", () => {
        writeConsent("rejected");
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
        renderMenuChats();
        if (settingsModal) settingsModal.classList.remove("open");
      });
    }

    if (clearAllBtn) {
      clearAllBtn.addEventListener("click", () => {
        conversations = [];
        activeConvId = null;
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
        createNewConversation();
      });
    }

    if (composerForm && promptInput) {
      composerForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const val = promptInput.value.trim();
        if (!val) return;
        promptInput.value = "";
        sendPrompt(val);
      });
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    let activeAudioStream = null;
    let basePromptText = "";

    function setMicUI(active, titleText) {
      isListening = active;
      if (!micBtn) return;
      micBtn.classList.toggle("listening", active);
      micBtn.title = titleText || (active ? "Dinliyor... (Durdurmak için basın)" : "Sesle Yaz");
    }

    function releaseAudioStream() {
      if (activeAudioStream) {
        try {
          activeAudioStream.getTracks().forEach((track) => track.stop());
        } catch (_) {}
        activeAudioStream = null;
      }
    }

    async function activateDeviceMicrophone() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (promptInput) promptInput.placeholder = "Bu cihaz/tarayıcı mikrofonu desteklemiyor";
        return;
      }
      try {
        activeAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        setMicUI(true, "Mikrofon açık... (Kapatmak için basın)");
        if (promptInput) {
          promptInput.placeholder = "Mikrofon açık — konuşun veya yazın...";
          promptInput.focus();
        }
      } catch (err) {
        releaseAudioStream();
        setMicUI(false, "Sesle Yaz");
        if (promptInput) {
          if (err && (err.name === "NotAllowedError" || err.name === "PermissionDeniedError")) {
            promptInput.placeholder = "Mikrofon izni verilmedi";
          } else if (err && (err.name === "NotFoundError" || err.name === "DevicesNotFoundError")) {
            promptInput.placeholder = "Mikrofon bulunamadı";
          } else {
            promptInput.placeholder = "Mikrofon açılamadı";
          }
        }
      }
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "tr-TR";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        basePromptText = promptInput ? promptInput.value.trim() : "";
        setMicUI(true, "Dinliyor... (Durdurmak için basın)");
        if (promptInput) promptInput.placeholder = "Dinliyor...";
      };

      recognition.onresult = (event) => {
        let interim = "";
        let finalStr = "";
        for (let i = 0; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalStr += t;
          } else {
            interim += t;
          }
        }
        const spoken = (finalStr || interim).trim();
        if (spoken && promptInput) {
          promptInput.value = basePromptText ? `${basePromptText} ${spoken}` : spoken;
          promptInput.focus();
        }
      };

      recognition.onerror = (event) => {
        setMicUI(false, "Sesle Yaz");
        const errType = event && event.error ? event.error : "";
        if (errType === "not-allowed" || errType === "service-not-allowed") {
          if (promptInput) promptInput.placeholder = "Mikrofon izni verilmedi";
          return;
        }
        if (errType === "audio-capture") {
          if (promptInput) promptInput.placeholder = "Mikrofon bulunamadı";
          return;
        }
        if (errType === "network") {
          activateDeviceMicrophone();
          return;
        }
        if (promptInput && promptInput.placeholder === "Dinliyor...") {
          promptInput.placeholder = "YF'ye sorun";
        }
      };

      recognition.onend = () => {
        if (!activeAudioStream) {
          setMicUI(false, "Sesle Yaz");
          if (promptInput && promptInput.placeholder === "Dinliyor...") {
            promptInput.placeholder = "YF'ye sorun";
          }
        }
      };
    }

    if (micBtn) {
      micBtn.addEventListener("click", async () => {
        if (activeAudioStream) {
          releaseAudioStream();
          setMicUI(false, "Sesle Yaz");
          if (promptInput) promptInput.placeholder = "YF'ye sorun";
          return;
        }

        if (recognition) {
          if (isListening) {
            try { recognition.stop(); } catch (_) {}
            setMicUI(false, "Sesle Yaz");
            if (promptInput) promptInput.placeholder = "YF'ye sorun";
            return;
          }
          try {
            recognition.start();
            return;
          } catch (_) {
            setMicUI(false, "Sesle Yaz");
          }
        }

        await activateDeviceMicrophone();
      });
    }

    updateConsentBadge();
    loadConversations();
    if (conversations.length > 0) {
      activeConvId = conversations[0].id;
    } else {
      createNewConversation();
    }
    renderMenuChats();
    renderMessages();
    if (cookieConsent !== "accepted" && settingsModal) {
      settingsModal.classList.add("open");
    }
  </script>
</body>
</html>
